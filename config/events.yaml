- id: e2024b
  name: Nov 2024 (Storm Bert)
  start: "2024-11-20T00:00:00Z"
  end: "2024-12-05T00:00:00Z"
  peak: {newbotley: 2.788, minns: 2.819, coldharbour: 2.455, kingsmill: 2.785}
  headline: false
  notes: >-
    Mainly a Cherwell event. Kings Mill first reached 2.60 m at 06:30Z on 26 Nov and peaked at 2.785 m
    at 01:15Z on 27 Nov (record; GOV.UK rounds to 2.79). EA Cherwell Oxford warning from 07:26 on
    26 Nov to 09:35 on 29 Nov. The Thames side peaked later and lower: New Botley 2.788 m on 29 Nov
    (just above 2.76), Minns 2.819 m (below 2.90). Oxford City Council reported no flooded
    properties on 26 Nov. Window confirmed.
  sources:
    - https://check-for-flooding.service.gov.uk/station/7071
    - https://riverlevels.uk/flood-warning-river-cherwell-for-the-oxford-area
    - http://web.archive.org/web/20251015053110/https://www.oxford.gov.uk/news/article/1591/flood-warnings-issued-for-oxford-as-river-levels-continue-to-rise

- id: e2026
  name: Jan–Mar 2026
  start: "2026-01-15T00:00:00Z"
  end: "2026-03-10T00:00:00Z"
  peak: {newbotley: 2.657, minns: 2.742, coldharbour: 2.120, kingsmill: 2.291}
  headline: false
  notes: >-
    Near-miss / false-alarm test: no trained gauge reached its threshold. WINDOW CHANGED from SPEC
    (2026-02-18 → 2026-03-10). High water started much earlier: in the flood-monitoring daily archive,
    Osney d/s reads 3.17 m on 20 Jan, 3.36 m on 30 Jan, 3.51 m on 10 Feb and 3.535 m on 16 Feb, then
    falls to 3.13 m by 2 Mar. Those are daily maxima of sampled days only, so the true peak may be a
    little higher; Data should compute it from the archive (it covers 2025-10-29 onwards). So the
    SPEC "3.41 m" (FloodRadar, alert of 25 Feb – 4 Mar) is a late-phase value, not the event peak;
    the event peaked around 3.54 m, still below 3.79. Other sampled d/s maxima: Godstow 2.91 m
    (17 Feb, below 3.07) and Iffley 3.10 m (10 and 18 Feb, below 3.25). Hydrology peaks: New Botley
    2.657 m on 16 Feb, Minns 2.742 m on 16 Feb, Cold Harbour 2.120 m on 17 Feb, Kings Mill 2.291 m on
    9 Feb. The #2 Data agent found no Oxford warning messages in this window in the Historic Flood
    Warnings dataset; FloodRadar shows a flood alert for 061WAF23Oxford from 25 Feb, so check
    whether the dataset (to June 2026) has it.
  sources:
    - https://www.floodradar.co.uk/flood-event/flood-alert-river-thames-and-tributaries-in-the-oxford-area-2026-02-25
    - https://environment.data.gov.uk/flood-monitoring/archive
