- id: e2024a
  name: Jan 2024 (Storm Henk)
  start: "2023-12-28T00:00:00Z"
  end: "2024-01-15T00:00:00Z"
  peak: {newbotley: 2.920, minns: 2.968, coldharbour: 2.659, kingsmill: 2.643}
  headline: false
  notes: >-
    Abingdon Road closed at about 21:30 on Fri 5 Jan 2024 (GMT = UTC). Osney Island streets flooded on
    the evening of 4 Jan. First 15-min threshold crossings: New Botley 18:00Z on 4 Jan, Kings Mill
    21:00Z on 4 Jan, Cold Harbour 22:00Z on 4 Jan, Minns 05:30Z on 5 Jan. EA warnings: Wolvercote from
    22:25 on 4 Jan, Cherwell Oxford from 19:26 on 5 Jan, Binsey/Osney from 09:30 on 6 Jan. Window
    confirmed.
  sources:
    - https://www.highwaysmagazine.co.uk/news/local-road-network/freeze-adds-counties-flooding-woes
