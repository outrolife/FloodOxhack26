# River Clock named flood events (SPEC §4.3; §9 `EventMeta`). Owner: Story. Verified 24 Oct 2026 (issue #10).
#
# Top-level list. The §9 fields are id, name, start, end, peak, headline. Extra fields (notes, sources)
# are for humans and the About tab. Leave them out when writing events.json.
# Times are ISO 8601 UTC. Windows are analysis windows, not flood durations; §6.1 auto-detection
# adds more events.
#
# `peak` is PROVISIONAL: the EA Hydrology daily maximum (`level-max-86400`) for the four trained
# targets (SPEC §4.1.1), pulled with small one-gauge, one-window queries. Each gauge has its own
# datum, so never compare values across gauges. The backtest should overwrite these from
# hourly.parquet. Osney, Godstow and Iffley downstream values are context only (no history) and sit
# in `notes`, not `peak`.

- id: e2007
  name: July 2007
  start: "2007-07-18T00:00:00Z"
  end: "2007-08-02T00:00:00Z"
  peak: {newbotley: 3.141, minns: 3.117, coldharbour: 2.690, kingsmill: 2.575}
  headline: false
  notes: >-
    Summer event: very heavy rain on 20 Jul 2007. Peaks: Godstow d/s 3.11 m on 20 Jul (GOV.UK
    record), Minns 3.117 m on 23 Jul (record), New Botley 3.141 m on 25 Jul (record), Cold Harbour
    2.690 m on 25 Jul. Window confirmed. Hydrology daily series have gaps (12–13 of 16 days present),
    so Data should check coverage. Kings Mill (2.575 m) stayed below 2.60, so this was not a Cherwell
    flood at Oxford. Official warnings for 2006–08 use the legacy codes 061FWF233 (Thames, Eynsham
    Lock to Sandford Lock), 061FWF142 (Cherwell) and 061WAFW06 (alert), per the #2 Data agent and
    model/official.py.
  sources:
    - https://check-for-flooding.service.gov.uk/station/7056/downstream
    - https://check-for-flooding.service.gov.uk/station/7075
    - https://check-for-flooding.service.gov.uk/station/7074
    - https://oxfordhistory.org.uk/floods/2007/index.html

- id: e2012
  name: Nov–Dec 2012
  start: "2012-11-20T00:00:00Z"
  end: "2013-01-05T00:00:00Z"
  peak: {newbotley: 2.901, minns: 2.927, coldharbour: 2.558, kingsmill: 2.722}
  headline: false
  notes: >-
    Two peaks: about 27 Nov 2012 at all four gauges, and about 27 Dec 2012 (Iffley d/s 3.58 m on 27 Dec,
    the highest until 8 Jan 2014 per the EA; New Botley 2.901 m on 27 Dec). CORRECTION to SPEC:
    "Cherwell record" is wrong for Kings Mill. Its peak was 2.722 m on 27 Nov 2012; the gauge record
    is 2.785 m on 27 Nov 2024. Window confirmed.
  sources:
    - https://www.cherwell.org/2014/01/07/update-floods-hit-central-oxford/
    - https://oxfordhistory.org.uk/floods/2012/index.html

- id: e2014
  name: Jan–Feb 2014
  start: "2013-12-20T00:00:00Z"
  end: "2014-02-20T00:00:00Z"
  peak: {newbotley: 3.032, minns: 3.090, coldharbour: 2.699, kingsmill: 2.678}
  headline: true
  notes: >-
    Headline replay (on newbotley, SPEC §4.1.1). EA Cherwell warnings from 28 Dec 2013. Main peak
    6–9 Jan: Kings Mill 2.678 m on 7 Jan; New Botley 3.032 m, Minns 3.090 m and Cold Harbour 2.699 m
    on 9 Jan. Context: Osney d/s 3.97 m on 9 Jan (GOV.UK record; 3.93 m per the Oxford Flood Alliance)
    and Iffley d/s 3.6 m on 8 Jan. Abingdon Road closed on the morning of 8 Jan. A second wave in
    February (ITV, 9 Feb: Botley and Abingdon Roads closed), with thresholds still crossed until
    9–12 Feb. Window confirmed.
  sources:
    - https://check-for-flooding.service.gov.uk/station/7057/downstream
    - https://www.cherwell.org/2014/01/07/update-floods-hit-central-oxford/
    - https://itv.com/news/meridian/2014-02-09/oxfordshire-facing-worse-flooding-since-2007
    - https://osneyisland.org.uk/wp-content/uploads/2023/02/osney-newsletter-2023-feb.pdf
    - https://oxfordhistory.org.uk/floods/2014/index.html

- id: e2021
  name: Jan–Feb 2021
  start: "2021-01-20T00:00:00Z"
  end: "2021-02-20T00:00:00Z"
  peak: {newbotley: 2.819, minns: 2.903, coldharbour: 2.503, kingsmill: 2.663}
  headline: false
  notes: >-
    PROPOSED by Story (not in SPEC §4.3). Threshold crossed at newbotley (2–3 Feb), coldharbour
    (1–3 Feb) and kingsmill (31 Jan – 2 Feb), and just touched at minns (2.903 m, 3 Feb). Oxford City
    Council reported 5 flood warnings and 4 alerts from 30–31 Jan, a barrier at Bulstake Close, and
    Ferry Hinksey Road flooded. Context: Osney d/s 3.73 m, "most serious since 2014", with no homes
    reported flooded. A useful near-threshold test. Drop it if §6.1 auto-detection already finds it.
  sources:
