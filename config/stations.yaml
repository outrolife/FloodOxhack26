# Flow paths = the river walk (SPEC §4.1, §4.1.1, §7.2; #125 A). For each trained target, every gauge
# the water passes walking upstream from it. Each gauge enters the model as its anomaly vs its own
# median, shifted by its measured travel time (lags.json). This section is the single source for
# model/features.py and analysis/travel_times.py (each keeps an identical fallback copy for tests).
# Basins only group the targets; each list is flat, in model column order: the near gauges first,
# then the further ones.
#   farmoor, eynsham    Thames above Oxford            shifford, hannington   Thames further up
#   cassington          Evenlode (just above Thames)   shipton                Evenlode further up
#   worsham             Windrush (joins at Newbridge)
# The further gauges are used for newbotley and minns only: they lowered coldharbour's and kingsmill's
# 72 h skill in experiment A (#125), so those two keep their near gauges. The main-channel locks
# (godstow, osney, iffley) are live only and have no pairs.
flow_paths:
  thames:
    newbotley: [farmoor, eynsham, cassington, shifford, hannington, worsham, shipton]
    minns: [farmoor, eynsham, cassington, shifford, hannington, worsham, shipton]
    coldharbour: [farmoor, eynsham, cassington]
  cherwell:
    kingsmill: [enslow, islip]

# Catchment gauges (issue #146): a ring of upstream EA level gauges within ~35 km of Oxford on the
# Thames, Windrush, Glyme, Evenlode, Cherwell and Ray, shown live on the map so the
# app has real readings further out. Display only: role live_only (the SPEC §9 role), never forecast,
# not trained, no travel-time pairs. This is a separate section so pipeline.ingest_history, the quality
# report and the model (which read `gauges:` via pipeline.stations.load_gauges) are unchanged; only
# pipeline.ingest_live (live readings) and pipeline.export_static (stations.json) read it.
#
# Found with /flood-monitoring/id/stations?lat=51.75&long=-1.26&dist=35&parameter=level on 2026-10-24;
# every entry had ~95 readings in the 24 h before 21:30Z. Fields as for `gauges:`, from the
# flood-monitoring scale of the trace used: amber = typicalRangeHigh, record = maxOnRecord, threshold =
# GOV.UK "Property flooding is possible above this level" for that trace's page (null when GOV.UK has
# none, or when it is not above amber). distance_km is the straight line from Carfax. Each level is on
# its own gauge datum: never compare it with another gauge.
#
# Traces: lock gauges use the d/s stage (the river level the GOV.UK flood thresholds refer to), except
# shifford, which uses the u/s stage like eynsham, because that is the trace #125 A verified against its
# Hydrology history. The #125 A gauges (shifford, hannington, worsham, shipton, banbury, lowerarncott)
# keep #125's keys and fm measures, so adopting them as model inputs is a move to `gauges:` with
# role: upstream plus a hydrology block.
