# Flow paths (SPEC §4.1): upstream gauges per downstream gauge, for travel times and features.
flow_paths:
  thames:
    godstow: [farmoor, eynsham, cassington]
    osney: [godstow]
    iffley: [osney]
    newbotley: [farmoor, eynsham, cassington, godstow]   # Bulstake Stream, fed by the Thames system
  cherwell:
    kingsmill: [enslow, islip]
