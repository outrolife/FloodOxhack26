# River Clock gauge configuration (SPEC §4.1). Owner: Data.
#
# Verified against the live EA APIs on 2026-10-24 (issue #2, SPEC §14):
#   - flood-monitoring  https://environment.data.gov.uk/flood-monitoring/id/stations/{ref}
#   - Hydrology         https://environment.data.gov.uk/hydrology/id/stations?wiskiID={ref}
#   - GOV.UK pages      https://check-for-flooding.service.gov.uk/station/{rloi_id}[/downstream]
# Raw responses are cached under data/raw/verify/ (gitignored).
#
# Field guide
#   key, name, river, role, ref, lat, lon, amber, threshold, record: the SPEC §9 `Station` fields.
#     ref     = flood-monitoring stationReference. lat/lon = flood-monitoring station position.
#     amber   = typicalRangeHigh of the trace we use (GOV.UK "top of normal range").
#     threshold = GOV.UK "property flooding is possible above this level" (not in the API), or null.
#     record  = maxOnRecord of the trace we use (GOV.UK "highest level recorded").
#   trace          stage (upstream / single-trace) or downstage (downstream of a lock). The SPEC §4.1 choice.
#   fm_measure     flood-monitoring live measure for that trace (15-min, mASD).
#   hydrology      Hydrology API station GUID, 15-min level measure, which trace it holds, earliest reading.
#                  Hydrology dateTimes have no offset; they agree with flood-monitoring record times, which are
#                  treated as UTC. Hydrology measure ids end in `level-i-900-m-qualified` (not `level-i-900`).
#   history_ok     true if the Hydrology series is the same trace as `trace` (usable for training/backtests).
#   datum_maod     flood-monitoring scale `datum` for the trace (undocumented field; see datum note below).
#   api            raw scale values from flood-monitoring metadata for the trace used.
#   spec           §4.1 table values, only where they differ from what we verified.
#   verified       one-line provenance.
#
# Datum note (for stretch S3): the scale `datum` values are consistent with metres above Ordnance Datum
# along the Thames lock chain. Readings at 2026-10-24 15:30Z: Godstow d/s 56.534, Osney u/s 56.478 (5.6 cm
# lower, the reach slope), Osney d/s 54.723, Iffley u/s 54.742 (same pound, within 2 cm). Round values
# (50, 54, 60, 0) are flagged as unverified.
#
# BIG CAVEAT (issue #2): for the four lock gauges that §4.1 reads downstream (eynsham, godstow, osney,
# iffley), the Hydrology API holds ONLY the upstream (head-water) stage. No public downstream history
# exists before 2025-10-29 (the start of the rolling flood-monitoring archive). The upstream series of
# osney and godstow are near-flat in floods because the weir holds them. See the issue #2 comments.

gauges:
  - key: farmoor
    name: Farmoor
    river: Thames
    role: upstream
    ref: 1100TH
    rloi_id: "7047"
    lat: 51.757544
    lon: -1.366384
    amber: 1.30
    threshold: 1.75
    record: 2.006            # 2007-07-24T19:30
    trace: stage
    fm_measure: 1100TH-level-stage-i-15_min-mASD
    hydrology:
      station: 6b80bd1c-6c19-4c26-875d-108bf8ef1a84
      level_measure: 6b80bd1c-6c19-4c26-875d-108bf8ef1a84-level-i-900-m-qualified
      trace: stage
      earliest: "1992-09-07T14:45:00Z"
    history_ok: true
    datum_maod: 60.0         # round value: unverified
    api: {typicalRangeLow: 0.5, typicalRangeHigh: 1.3, highestRecent: 1.835, maxOnRecord: 2.006}
    verified: "API + GOV.UK match §4.1. Hydrology Jul 2007 15-min peak 2.006 at 19:30 = maxOnRecord. Level only (flow rating unreliable)."

  - key: eynsham
    name: Eynsham Lock d/s
    river: Thames
    role: upstream
    ref: 1201TH
    rloi_id: "7049"
    lat: 51.774692
    lon: -1.356854
    amber: 2.67              # API typicalRangeHigh and GOV.UK both say 2.67; §4.1 said 2.96
    threshold: 3.48          # GOV.UK downstream page; §4.1 had none
    record: 3.648            # 2007-07-20T03:00
    trace: downstage
    fm_measure: 1201TH-level-downstage-i-15_min-mASD
    hydrology:
      station: dd230984-b45b-4fd6-8ebf-45ca375799f1
      level_measure: dd230984-b45b-4fd6-8ebf-45ca375799f1-level-i-900-m-qualified
      trace: stage           # UPSTREAM only (max 1.187 on 2007-07-24 = upstream maxOnRecord)
      earliest: "2000-01-30T09:00:00Z"
    history_ok: false
    upstream_alt:            # the trace Hydrology actually holds; rises clearly in floods (median 0.16, ~1.0 at peaks)
      fm_measure: 1201TH-level-stage-i-15_min-mASD
      datum_maod: 59.676
      api: {typicalRangeLow: 0.038, typicalRangeHigh: 0.37, highestRecent: 1.187, maxOnRecord: 1.187}
    datum_maod: 57.134
    api: {typicalRangeLow: 1.773, typicalRangeHigh: 2.67, highestRecent: 3.648, maxOnRecord: 3.648}
    spec: {amber: 2.96, threshold: null}
    verified: "Threshold MISMATCH vs §4.1 (amber 2.96 -> 2.67). D/s history only from 2025-10-29 (archive) + live."

