# River Clock gauge configuration (SPEC §4.1 and §4.1.1). Owner: Data.
#
# Verified against the live EA APIs on 2026-10-24 (issue #2, SPEC §14):
#   - flood-monitoring  https://environment.data.gov.uk/flood-monitoring/id/stations/{ref}
#   - Hydrology         https://environment.data.gov.uk/hydrology/id/stations?wiskiID={ref}
#   - GOV.UK pages      https://check-for-flooding.service.gov.uk/station/{rloi_id}[/downstream]
# Raw responses are cached under data/raw/verify/ (gitignored).
#
# Roles (PM decision after #2, SPEC §4.1.1):
#   upstream   feature gauge with Hydrology history on the trace we use
#   target     trained and backtested target (newbotley = primary, kingsmill, minns, coldharbour)
#   live_only  shown live from flood-monitoring only; not trained, backtested or used as a feature. Either
#              no matching history (osney, godstow, iffley: history_ok false) or history the model does
#              not use (banbury, lowerarncott, #125: history_ok true, ingested for analysis only).
#
# Field guide
#   key, name, river, role, ref, lat, lon, amber, threshold, record: the SPEC §9 `Station` fields.
#     ref       = flood-monitoring stationReference. lat/lon = flood-monitoring station position.
#     amber     = typicalRangeHigh of the trace we use (GOV.UK "top of normal range").
#     threshold = GOV.UK "property flooding is possible above this level" (not in the API), or null.
#     record    = maxOnRecord of the trace we use (GOV.UK "highest level recorded").
#   trace          which flood-monitoring trace we use: u/s (qualifier "Stage" at a lock), d/s ("Downstream
#                  Stage") or single (single-trace station, qualifier "Stage").
#   fm_measure     flood-monitoring live measure for that trace (15-min, mASD).
#   hydrology      Hydrology API station GUID, 15-min level measure, its qualifier, and earliest reading.
#                  Hydrology measures carry no qualifier field. It was identified by matching values to the
#                  flood-monitoring stageScale / downstageScale records. Measure ids end in
#                  `level-i-900-m-qualified` (not `level-i-900`). Hydrology dateTimes have no offset; they
#                  agree with flood-monitoring record times and are treated as UTC.
#   history_ok     true if the Hydrology series is the same trace as `trace` (usable for training/backtests).
#   datum_maod     flood-monitoring scale `datum` for the trace (an undocumented field; see the datum note).
#   api            raw scale values from flood-monitoring metadata for the trace used.
#   spec           the original §4.1 values, only where they differ from what we verified.
#   other_trace    the lock's other trace, for reference.
#   verified       one-line provenance.
#
# Datum note (for stretch S3): on the Thames lock chain the scale `datum` values are consistent with metres
# above Ordnance Datum. Readings at 2026-10-24 15:30Z: Godstow d/s 56.534, Osney u/s 56.478 (5.6 cm lower,
# the reach slope), Osney d/s 54.723, Iffley u/s 54.742 (same pound, within 2 cm). Round values (50, 53,
# 54, 60, 0) are flagged unverified. That includes newbotley and minns, the S3 prerequisite gauges.

