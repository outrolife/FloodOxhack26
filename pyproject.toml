[project]
name = "river-clock"
version = "0.1.0"
description = "Forecast when, and how likely, Oxford flood trouble spots will flood in the next 72 h"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "lightgbm>=4.3",
    "pyarrow>=15",
    "duckdb>=1.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
# SPEC §11; only once the core gate in §13 is met
stretch = ["geopandas>=0.14", "rasterio>=1.3", "shapely>=2.0"]
# Optional Tiger Data (Timescale/Postgres) mirror, SPEC §2 (P2): `make mirror`
mirror = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
# scripts/ runs under the system python3 (3.9) from the hooks, so it keeps 3.9-style typing
extend-exclude = ["web", "data", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
